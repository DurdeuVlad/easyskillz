  <style>
    .card {
      fill: url(#cardGrad);
      stroke-width: 1.5;
      rx: 12;
    }
    .card-group {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-group:hover {
      transform: translateY(-5px);
    }
    .title {
      fill: #f0f6fc;
      font-size: 13.5px;
      font-weight: 600;
      text-anchor: middle;
      letter-spacing: -0.1px;
    }
    .sub {
      fill: #8b949e;
      font-size: 11px;
      text-anchor: middle;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
    }
    
    /* Subtle breathing animation for brand graphics centered at local Y=12 center */
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    .brand-icon {
      transform-origin: 12px 12px;
      animation: subtlePulse 4s ease-in-out infinite;
    }
    .claude-pulse { animation-delay: 0s; }
    .cursor-pulse { animation-delay: 0.5s; }
    .devin-pulse { animation-delay: 1s; }
    .gemini-pulse { animation-delay: 1.5s; }
    .copilot-pulse { animation-delay: 2s; }
    .windsurf-pulse { animation-delay: 2.5s; }
    .codex-pulse { animation-delay: 3s; }
  </style>

