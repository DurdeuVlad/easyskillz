<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="350" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <style>
      .terminal {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 8;
      }
      .header {
        fill: #161b22;
        rx: 8;
      }
      .dot {
        rx: 5;
        ry: 5;
      }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title-text {
        fill: #8b949e;
        font-size: 13px;
        font-weight: 500;
      }
      .term-text {
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        font-size: 14px;
        fill: #c9d1d9;
      }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0883e; }
      .success { fill: #3fb950; font-weight: bold; }
      .dim { fill: #8b949e; }
      .check { fill: #3fb950; }

      /* Animations */
      .line {
        opacity: 0;
        animation: fade-in 0.3s ease-out forwards;
      }

      .l1 { animation-delay: 0.8s; }
      .l2 { animation-delay: 1.3s; }
      .l3 { animation-delay: 1.7s; }
      .l4 { animation-delay: 2.1s; }
      .l5 { animation-delay: 2.5s; }
      .l6 { animation-delay: 3.1s; }
      .l7 { animation-delay: 3.6s; }
      .l8 { animation-delay: 4.1s; }
      .l9 { animation-delay: 4.7s; }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Terminal window background -->
  <rect x="10" y="10" width="680" height="330" class="terminal" />
  
  <!-- Terminal header bar -->
  <path d="M 10 18 A 8 8 0 0 1 18 10 L 682 10 A 8 8 0 0 1 690 18 L 690 45 L 10 45 Z" class="header" />
  
  <!-- Window Controls -->
  <circle cx="30" cy="28" r="6" class="dot dot-red" />
  <circle cx="50" cy="28" r="6" class="dot dot-yellow" />
  <circle cx="70" cy="28" r="6" class="dot dot-green" />
  
  <!-- Terminal Window Title -->
  <text x="350" y="32" text-anchor="middle" class="title-text">easyskillz — sync@terminal</text>

  <!-- Terminal Contents -->
  <g class="term-text" transform="translate(30, 80)">
    <!-- Prompt & Typing Command -->
    <text x="0" y="0">
      <tspan class="prompt">user@workspace:~$ </tspan>
      <tspan class="cmd">easyskillz project sync</tspan>
    </text>

    <!-- Sync Outputs -->
    <text x="0" y="30" class="line l1 dim">Scanning for AI tools in project root...</text>
    
    <text x="20" y="55" class="line l2"><tspan class="check">✓</tspan> Claude Code      <tspan class="dim">(.claude/skills)</tspan></text>
    <text x="20" y="75" class="line l3"><tspan class="check">✓</tspan> Cursor           <tspan class="dim">(.cursorrules)</tspan></text>
    <text x="20" y="95" class="line l4"><tspan class="check">✓</tspan> Devin            <tspan class="dim">(.devin/skills)</tspan></text>
    <text x="20" y="115" class="line l5"><tspan class="check">✓</tspan> Antigravity      <tspan class="dim">(.gemini/skills &amp; .agents/skills)</tspan></text>

    <text x="0" y="155" class="line l6 dim">Testing symlink support &amp; generating adapter stubs...</text>
    <text x="20" y="180" class="line l7"><tspan class="check">✓</tspan> Created real folder + adapter SKILL.md for Devin</text>
    <text x="20" y="200" class="line l8"><tspan class="check">✓</tspan> Wired symlink pointers for Claude Code &amp; Antigravity</text>
    
    <!-- Success Statement -->
    <text x="0" y="240" class="line l9"><tspan class="success">Done.</tspan> Project context sync complete! 4 tools wired. ✨</text>
  </g>
</svg>
