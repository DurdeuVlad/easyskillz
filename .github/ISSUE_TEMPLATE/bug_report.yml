name: Bug report
description: Report reproducible incorrect behavior that is not a security vulnerability.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately through SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: easyskillz version
      placeholder: 0.5.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and relevant agent host.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
