name: CI

on:
  push:
    branches: [master, release/*]
  pull_request:
    branches: [master, release/*]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # node-pty 1.1.0's macOS prebuild loses this mode bit; fixed upstream in 1.2 betas.
      - name: Repair node-pty macOS helper permissions
        if: runner.os == 'macOS'
        run: |
          helper_found=false
          while IFS= read -r helper; do
            chmod +x "$helper"
            test -x "$helper"
            helper_found=true
          done < <(find node_modules/node-pty -type f -name spawn-helper)
          test "$helper_found" = true
      - run: npm run ci
